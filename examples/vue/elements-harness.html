<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elements adapter harness</title>
  </head>
  <style>
    /* The reset section has to fit a 320px viewport beside everything else:
         the field width is a token for exactly this, and the fields here have
         no room for their 18rem default. */
    [data-testid="reset-form"] {
      --ds-field-width: 100%;
      display: grid;
      gap: 0.75rem;
      justify-items: start;
      inline-size: 100%;
      max-inline-size: 16rem;
    }
  </style>
  <body>
    <main style="display: grid; gap: 1rem; justify-items: start; padding: 2rem">
      <h1>Elements adapter harness</h1>
      <form data-testid="skills-form">
        <ds-multi-select label="Skills" name="skills" remove-on-backspace values="vue">
          <option value="svelte">Svelte</option>
          <option value="vue">Vue</option>
          <option value="react" disabled>React</option>
          <option value="elements">Elements</option>
        </ds-multi-select>
        <button type="submit">Submit skills</button>
        <p data-testid="skills-readout">Submitted: none</p>
      </form>
      <!-- The reset contract (ADR 0012). The page holds a copy of its own,
           the way a controlled consumer does, and counts what it is told. -->
      <form data-testid="reset-form">
        <ds-text-field label="Name" name="resetName" value="Ada"></ds-text-field>
        <ds-checkbox label="Subscribe" name="resetSubscribe" value="on" checked></ds-checkbox>
        <ds-switch label="Notifications" name="resetNotify" checked></ds-switch>
        <ds-select label="Fruit" name="resetFruit" value="pear">
          <option value="apple">Apple</option>
          <option value="pear">Pear</option>
        </ds-select>
        <ds-radio-group label="Size" name="resetSize" value="small">
          <option value="small">Small</option>
          <option value="large">Large</option>
        </ds-radio-group>
        <ds-checkbox-group label="Toppings" name="resetToppings" value="olive">
          <option value="olive">Olive</option>
          <option value="caper">Caper</option>
        </ds-checkbox-group>
        <ds-combobox label="City" name="resetCity" value="milan">
          <option value="london">London</option>
          <option value="milan">Milan</option>
        </ds-combobox>
        <ds-multi-select label="Languages" name="resetLangs" values="it">
          <option value="en">English</option>
          <option value="it">Italian</option>
        </ds-multi-select>
        <ds-textarea label="Notes" name="resetNotes" value="None"></ds-textarea>
        <button type="reset">Reset the form</button>
        <button type="submit">Submit reset form</button>
        <p data-testid="reset-readout">Resets: 0. Reports: 0.</p>
        <p data-testid="reset-payload">Payload: none</p>
      </form>

      <button type="button" data-testid="reflect">Reflect selection</button>
      <p data-testid="values-readout">Values: vue</p>
      <p data-testid="events-readout">Events: none</p>
    </main>
    <script type="module" src="/src/harness/elements-main.ts"></script>
  </body>
</html>
